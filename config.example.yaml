agent:
  source_id: station-001
  work_dir: ./runtime
  scan_seconds: 10
  min_free_bytes: 1073741824
  log_level: INFO

files:
  - id: fy3f-mersi
    system: PUUSDATA
    root: E:/PUUSDATA/FY3F/MERSI/L1/2026
    include: ['**/*.hdf', '**/*.xml']
    exclude: ['**/*.tmp', '**/*.part', '**/*.done']
    recursive: true
    initial_scan: new_only
    stable_seconds: 60

# 仅在确认事务提交顺序保证后启用（参见 docs/operations.md）。
mysql: []
#  - id: orders
#    host: 127.0.0.1
#    port: 3306
#    user: env:SYNC_MYSQL_USER
#    password: env:SYNC_MYSQL_PASSWORD
#    database: production
#    table: orders
#    primary_key: id
#    fields: [id, created_at, amount]
#    batch_size: 1000
#    poll_seconds: 10
#    initial_scan: new_only
#    prefix: db-increment
#    commit_order_guaranteed: true

targets:
  - id: suzhou
    enabled: true
    # 直接连接明文 MinIO 端点时使用 http，此时无需配置 ca_bundle。
    scheme: https
    host: suzhou-transfer.example.internal
    port: 443
    bucket: enterprise-raw
    prefix: transfer
    # 支持直接填写字符串，也支持使用 env:VARIABLE_NAME 引用环境变量。
    access_key: 'YOUR_MINIO_ACCESS_KEY'
    secret_key: 'YOUR_MINIO_SECRET_KEY'
    # ca_bundle: ./certificates/internal-ca.pem
    concurrency: 2
    timeout_seconds: 60
    retry_initial_seconds: 2
    retry_max_seconds: 300
    part_size: 16777216
    multipart_threshold: 16777216
  - id: site-b
    enabled: false
    host: site-b-transfer.example.internal
    port: 443
    bucket: enterprise-raw
    prefix: transfer
    access_key: env:SYNC_B_ACCESS_KEY
    secret_key: env:SYNC_B_SECRET_KEY
