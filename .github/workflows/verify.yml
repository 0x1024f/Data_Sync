name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy
          sudo haproxy -c -f deploy/haproxy/haproxy.cfg
      - if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        run: ./deploy/windows/build.ps1
      - if: runner.os == 'Windows' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: data-sync-windows-x64
          path: dist/
