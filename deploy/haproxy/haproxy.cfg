global
    log /dev/log local0
    user haproxy
    group haproxy
    maxconn 2048
    # Master-worker mode is supplied by the packaged systemd unit (-Ws).

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 10m
    timeout server 10m

frontend transfer_tls
    bind :443
    tcp-request inspect-delay 5s
    # Replace the example source network and backend IPs before deployment.
    acl allowed_source src 192.0.2.0/24
    tcp-request connection reject if !allowed_source
    acl tls_hello req.ssl_hello_type 1
    acl sz req.ssl_sni -i suzhou-transfer.example.internal
    acl site_b req.ssl_sni -i site-b-transfer.example.internal
    tcp-request content reject if tls_hello !sz !site_b
    tcp-request content accept if tls_hello
    tcp-request content reject if WAIT_END
    use_backend minio_suzhou if sz
    use_backend minio_site_b if site_b
    # No default backend: unknown/non-TLS clients have no route.

backend minio_suzhou
    server minio-sz 198.51.100.10:9000 check inter 10s fall 3 rise 2

backend minio_site_b
    server minio-b 203.0.113.10:9000 check inter 10s fall 3 rise 2
