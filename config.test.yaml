agent:
  source_id: station-relay-test-001
  work_dir: ./runtime-relay-test
  scan_seconds: 2
  min_free_bytes: 1073741824
  log_level: INFO

files:
  - id: fy3f-mersi-test
    system: PUUSDATA
    root: ./test-input
    include: ['**/*.hdf', '**/*.xml']
    exclude: ['**/*.tmp', '**/*.part', '**/*.done']
    recursive: true
    initial_scan: existing_and_new
    stable_seconds: 3
    quiet_seconds: 5
    filename_regex: 'ZNET_(?P<batch_no>(?P<satellite>FY3F)_(?P<obs_time>\d{8}_\d{4}))\.(?P<role>hdf|xml)'
    obs_time_format: '%Y%m%d_%H%M'
    timezone_offset: '+08:00'
    prefix: rs-raw

mysql: []

targets:
  - id: minio-http
    enabled: true
    scheme: http
    host: 192.168.0.21
    port: 30009
    # Replace with the existing bucket provided by the MinIO administrator.
    bucket: enterprise-raw
    prefix: transfer
    # Fill in literal credentials, or use env:VARIABLE_NAME.
    access_key: 'YOUR_MINIO_ACCESS_KEY'
    secret_key: 'YOUR_MINIO_SECRET_KEY'
