agent:
  source_id: station-relay-test-001
  work_dir: ./runtime-relay-test
  scan_seconds: 2
  min_free_bytes: 1073741824
  log_level: INFO

files:
  - id: fy3f-mersi-test
    system: PUUSDATA
    root: ./test-input
    include: ['**/*.hdf', '**/*.xml']
    exclude: ['**/*.tmp', '**/*.part', '**/*.done']
    recursive: true
    initial_scan: existing_and_new
    stable_seconds: 3

mysql: []

targets:
  - id: minio-http
    enabled: true
    scheme: http
    host: 192.168.0.21
    port: 30009
    # 替换为 MinIO 管理员提供的现有存储桶。
    bucket: enterprise-raw
    prefix: transfer
    # 直接填写凭据，或使用 env:VARIABLE_NAME 引用环境变量。
    access_key: 'YOUR_MINIO_ACCESS_KEY'
    secret_key: 'YOUR_MINIO_SECRET_KEY'
